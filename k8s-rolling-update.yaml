---
# Rolling Update Deployment Strategy
# This is the default Kubernetes deployment strategy
# Gradually replaces old pods with new pods

apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-rolling
  namespace: acefitness
  labels:
    app: acefitness
    strategy: rolling-update
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # One extra pod during update
      maxUnavailable: 0  # No pods unavailable (zero-downtime)
  revisionHistoryLimit: 10  # Keep last 10 revisions for rollback
  selector:
    matchLabels:
      app: acefitness
      strategy: rolling-update
  template:
    metadata:
      labels:
        app: acefitness
        strategy: rolling-update
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        - name: FLASK_ENV
          value: "production"
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: acefitness-rolling
  namespace: acefitness
  labels:
    app: acefitness
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    nodePort: 30003
  selector:
    app: acefitness
    strategy: rolling-update
