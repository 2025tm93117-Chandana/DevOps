---
# Blue-Green Deployment Strategy
# Blue = version 1.1.0, Green = version 3.0.0
# Scale up green and wait for readiness before switching the service slot.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-blue
  namespace: acefitness
  labels:
    app: acefitness-bluegreen
    slot: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: acefitness-bluegreen
      slot: blue
  template:
    metadata:
      labels:
        app: acefitness-bluegreen
        slot: blue
        version: v1
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:1.1.0-assignment
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: DEPLOYMENT_SLOT
          value: "blue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-green
  namespace: acefitness
  labels:
    app: acefitness-bluegreen
    slot: green
spec:
  replicas: 0  # Initially 0, scale up when ready to switch
  selector:
    matchLabels:
      app: acefitness-bluegreen
      slot: green
  template:
    metadata:
      labels:
        app: acefitness-bluegreen
        slot: green
        version: v2
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:3.0.0-build8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: DEPLOYMENT_SLOT
          value: "green"
---
apiVersion: v1
kind: Service
metadata:
  name: acefitness-bluegreen
  namespace: acefitness
  labels:
    app: acefitness-bluegreen
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    nodePort: 30001
  selector:
    app: acefitness-bluegreen
    slot: blue  # Change to 'green' to switch traffic
