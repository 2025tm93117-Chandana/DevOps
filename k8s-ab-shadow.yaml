apiVersion: v1
kind: Service
metadata:
  name: acefitness-experiment-stable
  namespace: acefitness
spec:
  selector:
    app: acefitness-canary
    version: stable
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: acefitness-experiment-candidate
  namespace: acefitness
spec:
  selector:
    app: acefitness-canary
    version: canary
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acefitness-experiment-proxy
  namespace: acefitness
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      log_format experiment '$request_method $uri status=$status '
                            'upstream=$upstream_addr upstream_status=$upstream_status';
      access_log /dev/stdout experiment;
      log_subrequest on;

      upstream stable_backend {
        server acefitness-experiment-stable:80;
      }
      upstream candidate_backend {
        server acefitness-experiment-candidate:80;
      }
      map $http_x_experiment $ab_backend {
        default stable_backend;
        B candidate_backend;
      }

      server {
        listen 8080;
        location / {
          proxy_pass http://$ab_backend;
        }
      }
      server {
        listen 8081;
        location = /version {
          if ($request_method != GET) { return 405; }
          mirror /__shadow;
          mirror_request_body off;
          proxy_pass http://stable_backend;
        }
        location = /__shadow {
          internal;
          proxy_pass http://candidate_backend/version;
        }
        location / {
          proxy_pass http://stable_backend;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-experiment-proxy
  namespace: acefitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acefitness-experiment-proxy
  template:
    metadata:
      labels:
        app: acefitness-experiment-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: ab
          containerPort: 8080
        - name: shadow
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /health
            port: ab
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: acefitness-experiment-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: acefitness-experiment-proxy
  namespace: acefitness
spec:
  type: NodePort
  selector:
    app: acefitness-experiment-proxy
  ports:
  - name: ab
    port: 8080
    targetPort: ab
    nodePort: 30004
  - name: shadow
    port: 8081
    targetPort: shadow
    nodePort: 30005
