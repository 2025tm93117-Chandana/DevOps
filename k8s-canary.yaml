---
# Canary Deployment Strategy
# Traffic is distributed among ready stable and canary pods.
# Replica counts do not guarantee an exact request distribution.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-stable
  namespace: acefitness
  labels:
    app: acefitness-canary
    version: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acefitness-canary
      version: stable
  template:
    metadata:
      labels:
        app: acefitness-canary
        version: stable
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:1.1.0-assignment
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: VERSION
          value: "stable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-canary
  namespace: acefitness
  labels:
    app: acefitness-canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acefitness-canary
      version: canary
  template:
    metadata:
      labels:
        app: acefitness-canary
        version: canary
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:3.0.0-build8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: VERSION
          value: "canary"
---
apiVersion: v1
kind: Service
metadata:
  name: acefitness-canary
  namespace: acefitness
  labels:
    app: acefitness-canary
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    nodePort: 30002
  selector:
    app: acefitness-canary
