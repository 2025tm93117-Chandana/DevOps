---
# Canary Deployment Strategy
# 90% traffic to stable version, 10% to canary version
# Gradually increase canary replicas as it proves stable

apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-stable
  namespace: acefitness
  labels:
    app: acefitness
    version: stable
spec:
  replicas: 9  # 90% of traffic
  selector:
    matchLabels:
      app: acefitness
      version: stable
  template:
    metadata:
      labels:
        app: acefitness
        version: stable
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: VERSION
          value: "stable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acefitness-canary
  namespace: acefitness
  labels:
    app: acefitness
    version: canary
spec:
  replicas: 1  # 10% of traffic (1 out of 10 pods)
  selector:
    matchLabels:
      app: acefitness
      version: canary
  template:
    metadata:
      labels:
        app: acefitness
        version: canary
    spec:
      containers:
      - name: acefitness
        image: 2025tm93117/acefitness:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: VERSION
          value: "canary"
---
apiVersion: v1
kind: Service
metadata:
  name: acefitness-canary
  namespace: acefitness
  labels:
    app: acefitness
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    nodePort: 30002
  selector:
    app: acefitness
  # Both stable and canary pods will receive traffic proportionally
  # 9 stable pods : 1 canary pod = 90% : 10% traffic split
